name: Build and Sign Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Generate Gradle Wrapper if missing
      run: |
        if [ ! -f "./gradlew" ]; then
          echo "gradlew not found, generating wrapper..."
          gradle wrapper --gradle-version 8.2
        fi
        chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Generate Keystore for apksigner
      run: |
        keytool -genkey -v -keystore release.keystore -alias mykey -keyalg RSA -keysize 2048 -validity 10000 -storepass password -keypass password -dname "CN=Test, O=Test, C=US"

    - name: Sign APK with apksigner
      run: |
        # Dynamically find the latest build-tools directory to prevent version mismatch errors
        BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/*/ 2>/dev/null | sort -V | tail -n 1)
        echo "Using build tools: $BUILD_TOOLS_DIR"
        ${BUILD_TOOLS_DIR}apksigner sign --ks release.keystore --ks-key-alias mykey --ks-pass pass:password --key-pass pass:password --out app-release-signed.apk app/build/outputs/apk/debug/app-debug.apk

    - name: Upload Signed APK
      uses: actions/upload-artifact@v4
      with:
        name: Signed-APK
        path: app-release-signed.apk
